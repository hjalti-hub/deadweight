name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -t . -v

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - run: deadweight --version

      - name: Says something useful when there is no history
        run: |
          out=$(deadweight --root "$(mktemp -d)")
          echo "$out" | grep -q "No Claude Code sessions found" || {
            echo "::error::unhelpful output with no transcripts: $out"; exit 1; }

      - name: Emits valid JSON with no history
        run: |
          deadweight --root "$(mktemp -d)" --json | python -c "
          import json,sys; d=json.load(sys.stdin)
          assert d['summary']['sessions'] == 0, d
          print('ok')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pipx install ruff
      - run: ruff check deadweight tests
      - run: ruff format --check deadweight tests
